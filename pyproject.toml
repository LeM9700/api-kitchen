[project]
name = "pizza-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 self-test crashes with bcrypt>=4.1 (no __about__, wrap-bug detection fails)
    "slowapi>=0.1.9",
    "stripe>=9.0",
    "motor>=3.4",
    "arq>=0.25",
    "redis>=5.0",
    "httpx[http2]>=0.27",
    "google-auth>=2.29",
    "PyJWT>=2.8",
    "cloudinary>=1.40",
    "anyio>=4.0",
    "defusedxml>=0.7",
    "bleach>=6.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "sentry-sdk[fastapi]>=2.0",
    "pytz>=2024.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "cryptography>=50.0.0",
    "h2>=4.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
exclude = ["alembic*", "docs*", "tests*", "Microsoft*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9"]
