name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pizza_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/pizza_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/pizza_test
      MONGO_URL: mongodb://localhost:27017
      ARQ_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      JWT_SECRET: test-secret-32-chars-minimum-here
      # Cloudinary — valeurs fictives suffisantes pour les tests unitaires.
      # Les tests qui font de vrais appels Cloudinary doivent être marqués @pytest.mark.integration.
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: "000000000000000"
      CLOUDINARY_API_SECRET: test-cloudinary-secret
      APP_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Alembic migrations
        run: uv run alembic upgrade head
      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing -v
      - name: Alembic schema check
        run: uv run alembic check
      - name: Security audit (pip-audit)
        run: uv run pip-audit --requirement <(uv export --no-hashes) || true
