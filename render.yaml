services:
  - type: web
    name: pizza-api
    env: python
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      # --- Base de données ---
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URL
        sync: false
      # --- Redis (deux variables distinctes : ARQ jobs + pub/sub WebSocket) ---
      - key: ARQ_REDIS_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # --- Auth ---
      - key: JWT_SECRET
        sync: false
      # --- Stripe ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Cloudinary (stockage images) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # --- CORS (JSON array des origines autorisées) ---
      # Ex : '["https://app.mondomaine.com","https://admin.mondomaine.com"]'
      - key: CORS_ORIGINS
        sync: false
      # --- URL publique de l'API (utilisée dans les liens d'email) ---
      # Ex : https://pizza-api.up.railway.app
      - key: APP_BASE_URL
        sync: false
      # --- SMTP (optionnel — emails désactivés si absent) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # --- Environnement ---
      - key: ENVIRONMENT
        value: production

  - type: worker
    name: pizza-worker
    env: python
    buildCommand: pip install -e .
    startCommand: python -m arq worker.main.WorkerSettings
    envVars:
      # Le worker ARQ a besoin des mêmes variables que le web service
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: ARQ_REDIS_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENVIRONMENT
        value: production
